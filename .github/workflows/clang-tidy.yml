name: Clang Tidy Check

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  clang-tidy:
    name: Clang Tidy Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm64

      - name: Build and Run Clang-Tidy in Docker
        run: |
          # Build the Docker image with clang-tidy added
          docker buildx build -f ./deploy/dockerfiles/DockerfileDeployJetson \
            --platform linux/arm64 --load \
            --build-arg projectDir=/ \
            --target builder \
            -t analysis-image .

          # Run clang-tidy analysis inside the container
          docker run --rm analysis-image bash -c "
            cd /home && \
            cmake -B build \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ && \
            run-clang-tidy \
              -p build \
              -checks='-*,readability-*,performance-*,modernize-*,bugprone-*,clang-analyzer-*' \
              -header-filter='.*' \
              -quiet
          "