name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
      - implement-zenoh-shared-memory
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm64

      - name: Build in Docker
        run: |
          docker buildx build -f ./deploy/dockerfiles/DockerfileDeployJetson \
            --platform linux/arm64 --load \
            --build-arg projectDir=/ \
            -t final-app .

          # Create temporary container
          docker create --name tmpapp final-app
          
          # Create directories for artifacts
          mkdir -p artifacts/bin
          mkdir -p artifacts/config
          
          # Extract binaries
          docker cp tmpapp:/home/JetsonNano/VehicleSystem ./artifacts/bin/
          docker cp tmpapp:/home/JetsonNano/XboxController ./artifacts/bin/
          docker cp tmpapp:/home/JetsonNano/MiddleWare ./artifacts/bin/
          docker cp tmpapp:/home/JetsonNano/CombinedController ./artifacts/bin/
          docker cp tmpapp:/home/JetsonNano/LaneDetector ./artifacts/bin/
          
          # Copy config files
          cp -r ./JetsonNano/config/Zenoh/* ./artifacts/config/
          cp -r ./JetsonNano/config/Systemd/* ./artifacts/config/
          
          # Create source code archive
          git archive --format=zip HEAD -o ./artifacts/source-code.zip
          
          # Create release archive
          cd artifacts
          zip -r ../release-package.zip *
          cd ..
          
          # Cleanup
          docker rm tmpapp

      - name: Get latest tag and increment
        id: tag
        run: |
          git fetch --tags --force
          git fetch origin
          latest_tag=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v1.0.0"
          fi
          major=$(echo $latest_tag | cut -d. -f1 | tr -d 'v')
          minor=$(echo $latest_tag | cut -d. -f2)
          patch=$(echo $latest_tag | cut -d. -f3)
          new_tag="v$major.$minor.$((patch + 1))"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          files: |
            release-package.zip
            artifacts/source-code.zip
            artifacts/bin/*
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: |
            ## Release Notes
            
            ### Included Files
            - Executables in `bin/`
            - Configuration files in `config/`
            - Complete source code in `source-code.zip`
            - All-in-one package in `release-package.zip`
            
            ### Installation
            1. Download the release package
            2. Extract to appropriate locations on Jetson Nano
            3. Follow setup instructions in documentation
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_LUIS }}